<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ODM Viewer — AR estável</title>
<link rel="stylesheet" href="./styles.css">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>
<header class="topbar">
  <div class="title">ODM Viewer · AR estável</div>
  <nav class="nav">
    <a class="active" href="./index.html">AR estável</a>
    <a href="./test.html">AR teste</a>
    <a href="./viewer.html">Visualizador 3D</a>
  </nav>
</header>

<div class="status-panel">
  <div><strong>Câmera:</strong> <span id="secure-status">verificando…</span></div>
  <div><strong>Modelo:</strong> <span id="model-status"><span class="loading"></span>carregando models/DamagedHelmet.glb…</span></div>
  <div><strong>Marcador:</strong> <span id="marker-status">aguardando Hiro…</span></div>
</div>

<a-scene embedded vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"
 renderer="antialias:true; alpha:true; colorManagement:true;"
 arjs="sourceType:webcam; trackingMethod:best; debugUIEnabled:false;">
  <a-marker id="marker" preset="hiro" emitevents="true"
    smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-entity id="stable-model" gltf-model="url(./models/DamagedHelmet.glb)"
      position="0 0 0" rotation="0 0 0" scale="1 1 1"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<script>
const secureStatus=document.querySelector("#secure-status");
const modelStatus=document.querySelector("#model-status");
const markerStatus=document.querySelector("#marker-status");
const model=document.querySelector("#stable-model");
const marker=document.querySelector("#marker");

if(window.isSecureContext){secureStatus.textContent="HTTPS OK";secureStatus.className="ok";}
else{secureStatus.textContent="sem HTTPS — câmera pode ser bloqueada";secureStatus.className="err";}

model.addEventListener("model-loaded",()=>{modelStatus.textContent="DamagedHelmet.glb carregado";modelStatus.className="ok";});
model.addEventListener("model-error",(e)=>{console.error(e.detail);modelStatus.textContent="erro ao carregar DamagedHelmet.glb";modelStatus.className="err";});
marker.addEventListener("markerFound",()=>{markerStatus.textContent="Hiro detectado";markerStatus.className="ok";});
marker.addEventListener("markerLost",()=>{markerStatus.textContent="Hiro fora da câmera";markerStatus.className="warn";});
</script>
</body>
</html>
