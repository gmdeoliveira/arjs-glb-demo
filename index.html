<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <title>AR.js - Marker Based + GLB</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js Marker Based -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <!-- Marcador padrão Hiro -->
    <a-marker preset="hiro">

      <!-- 2. Preload your .glb asset for optimal performance -->
      <a-assets>
        <a-asset-item id="my-model" src="models/model.glb"></a-asset-item>
      </a-assets>

      <!-- Cubo de referência:
           remova depois que confirmar que o GLB está aparecendo -->
      <a-box
        position="0 0.25 0"
        scale="0.15 0.15 0.15"
        material="color: red; opacity: 0.5; transparent: true;"
      ></a-box>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
