<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <title>AR.js - Marker Based + Imagem</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

  <a-entity
    id="mapa3d"
    gltf-model="url(models/model_1k.glb)"
    position="0 0 0"
    rotation="0 0 0"
    scale="0.1 0.1 0.1"
  ></a-entity>

    <a-assets>
      <img id="mapa-img" src="images/foto_voo_drone.png" />
    </a-assets>

    <!-- Marcador padrão Hiro -->
    <a-marker preset="hiro">

      <!--
        Imagem posicionada sobre o marcador.
        rotation="-90 0 0" deixa a imagem deitada no plano do marcador.
        width e height controlam o tamanho.
      -->
      <a-plane
        src="#mapa-img"
        position="0 0.01 0"
        rotation="-90 0 0"
        width="1.5"
        height="1.0"
        material="transparent: true; side: double;"
      ></a-plane>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
