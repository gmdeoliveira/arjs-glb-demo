<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>AR.js + GLB + Hiro</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js: build com suporte a markers -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font-size: 14px;
      line-height: 1.35;
      pointer-events: none;
    }

    #status.ok {
      background: rgba(0, 90, 20, 0.78);
    }

    #status.warn {
      background: rgba(150, 90, 0, 0.82);
    }

    #status.error {
      background: rgba(150, 0, 0, 0.82);
    }
  </style>
</head>

<body>
  <div id="status">Inicializando...</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- Iluminação simples para modelos que dependem de luz -->
    <a-entity light="type: ambient; intensity: 1.1"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>

    <!-- Marcador Hiro -->
    <a-marker
      id="hiro-marker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >
      <!-- Modelo GLB carregado a partir da pasta models. -->
      <a-entity
        id="glb-model"
        gltf-model="url(models/model.glb)"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.05 0.05 0.05"
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const statusEl = document.getElementById("status");
    const markerEl = document.getElementById("hiro-marker");
    const modelEl = document.getElementById("glb-model");

    let modelLoaded = false;
    let markerVisible = false;

    function renderStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = type;
    }

    window.addEventListener("load", () => {
      if (!window.isSecureContext) {
        renderStatus(
          "ERRO: página sem HTTPS. No celular a câmera normalmente não é liberada em http://IP:porta.",
          "error"
        );
        return;
      }

      renderStatus(
        "HTTPS OK. Autorize a câmera e aponte para o marcador Hiro.",
        "ok"
      );
    });

    modelEl.addEventListener("model-loaded", () => {
      modelLoaded = true;

      if (markerVisible) {
        renderStatus("Marcador encontrado + GLB carregado.", "ok");
      } else {
        renderStatus("GLB carregado. Agora aponte para o marcador Hiro.", "ok");
      }
    });

    modelEl.addEventListener("model-error", (event) => {
      console.error("Erro ao carregar GLB:", event.detail);
      renderStatus(
        "ERRO ao carregar models/model.glb. Verifique nome, caminho e console do navegador.",
        "error"
      );
    });

    markerEl.addEventListener("markerFound", () => {
      markerVisible = true;

      if (modelLoaded) {
        renderStatus("Marcador encontrado + GLB carregado.", "ok");
      } else {
        renderStatus(
          "Marcador encontrado. Aguardando o GLB carregar...",
          "warn"
        );
      }
    });

    markerEl.addEventListener("markerLost", () => {
      markerVisible = false;

      if (modelLoaded) {
        renderStatus("GLB carregado. Marcador perdido; aponte novamente para o Hiro.", "warn");
      } else {
        renderStatus("Marcador perdido. GLB ainda não carregou.", "warn");
      }
    });
  </script>
</body>
</html>
